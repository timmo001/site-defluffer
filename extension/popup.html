<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Site Defluffer</title>
    <link rel="stylesheet" href="popup.css">
    <script src="popup.js" defer></script>
  </head>
  <body>
    <main class="panel">
      <h1>Site Defluffer</h1>
      <p class="intro">Remove the fluff from supported sites.</p>

      <section class="card settings" aria-labelledby="twitch-settings">
        <p id="twitch-settings" class="label">Twitch</p>

        <label class="toggle" for="enabled-toggle">
          <span class="toggle__copy">
            <span class="toggle__title">Hide extra panels</span>
            <span class="toggle__hint">Enabled by default</span>
          </span>
          <span class="switch">
            <input id="enabled-toggle" type="checkbox">
            <span class="switch__ui" aria-hidden="true"></span>
          </span>
        </label>

        <label class="toggle" for="compact-input-toggle">
          <span class="toggle__copy">
            <span class="toggle__title">Keep chat input and bits on one line</span>
            <span class="toggle__hint">Disabled by default</span>
          </span>
          <span class="switch">
            <input id="compact-input-toggle" type="checkbox">
            <span class="switch__ui" aria-hidden="true"></span>
          </span>
        </label>
      </section>

      <p id="status" class="status" aria-live="polite"></p>
    </main>
  </body>
</html>
