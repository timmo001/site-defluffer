[tools]
node = "26.10.0"
"npm:pnpm" = "12.8.0"

[tasks.install]
run = "pnpm install --frozen-lockfile"

[tasks.typecheck]
depends = ["install"]
run = "pnpm typecheck"

[tasks.lint]
depends = ["install"]
run = "pnpm lint"

[tasks.test]
depends = ["install"]
run = "pnpm test"

[tasks.build]
depends = ["typecheck"]
run = "pnpm build"

[tasks.check]
depends = ["lint", "typecheck", "test", "build"]
