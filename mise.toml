[tools]
node = "26.5.1"
"npm:pnpm" = "11.19.0"

[tasks.install]
run = "pnpm install --frozen-lockfile"

[tasks.typecheck]
depends = ["install"]
run = "pnpm typecheck"

[tasks.test]
depends = ["install"]
run = "pnpm test"

[tasks.build]
depends = ["typecheck"]
run = "pnpm build"

[tasks.check]
depends = ["typecheck", "test", "build"]
