[tools]
node = "26.13.1"
"npm:pnpm" = "12.21.0"
# The hk pre-push hook and the linters it runs, matching CI.
hk = "2.11.1"
pkl = "0.33.0"
actionlint = "1.7.12"
shellcheck = "0.11.0"
"npm:markdownlint-cli2" = "0.24.1"
"pipx:yamllint" = "1.38.0"

[tasks.install]
run = "pnpm install --frozen-lockfile"

[tasks.typecheck]
depends = ["install"]
run = "pnpm typecheck"

[tasks.lint]
depends = ["install"]
run = "pnpm lint"

[tasks.format]
depends = ["install"]
run = "pnpm format"

[tasks."format:check"]
depends = ["install"]
run = "pnpm format:check"

[tasks.test]
depends = ["install"]
run = "pnpm test"

[tasks.build]
depends = ["typecheck"]
run = "pnpm build"

[tasks.check]
depends = ["lint", "typecheck", "test", "format:check", "build"]
