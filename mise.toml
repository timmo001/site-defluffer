[tools]
node = "26.13.1"
"npm:pnpm" = "12.21.0"

[tasks.install]
run = "pnpm install --frozen-lockfile"

[tasks.typecheck]
depends = ["install"]
run = "pnpm typecheck"

[tasks.lint]
depends = ["install"]
run = "pnpm lint"

[tasks.format]
depends = ["install"]
run = "pnpm format"

[tasks."format:check"]
depends = ["install"]
run = "pnpm format:check"

[tasks.test]
depends = ["install"]
run = "pnpm test"

[tasks.build]
depends = ["typecheck"]
run = "pnpm build"

[tasks.check]
depends = ["lint", "typecheck", "test", "format:check", "build"]
