---
name: Lint

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@3cf8f01f8c16da062a2664dc0082087e47970628 # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@3cf8f01f8c16da062a2664dc0082087e47970628 # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@3cf8f01f8c16da062a2664dc0082087e47970628 # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@3cf8f01f8c16da062a2664dc0082087e47970628 # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@3cf8f01f8c16da062a2664dc0082087e47970628 # master
    with:
      scandir: scripts
      severity: warning
