---
name: Lint

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@9de9c3603fdc58bf75a61bfa07d38e32e6dc7c71 # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@9de9c3603fdc58bf75a61bfa07d38e32e6dc7c71 # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@9de9c3603fdc58bf75a61bfa07d38e32e6dc7c71 # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@9de9c3603fdc58bf75a61bfa07d38e32e6dc7c71 # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@9de9c3603fdc58bf75a61bfa07d38e32e6dc7c71 # master
    with:
      scandir: scripts
      severity: warning
