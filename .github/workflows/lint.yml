---
name: Lint

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@b3b7559c4d391bfb44f16c80792b363c6dbfc828 # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@b3b7559c4d391bfb44f16c80792b363c6dbfc828 # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@b3b7559c4d391bfb44f16c80792b363c6dbfc828 # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@b3b7559c4d391bfb44f16c80792b363c6dbfc828 # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@b3b7559c4d391bfb44f16c80792b363c6dbfc828 # master
    with:
      scandir: scripts
      severity: warning
