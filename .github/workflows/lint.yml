---
name: Lint

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@db1c7b0288facbdf5afe34db9135d960992049ba # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@db1c7b0288facbdf5afe34db9135d960992049ba # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@db1c7b0288facbdf5afe34db9135d960992049ba # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@db1c7b0288facbdf5afe34db9135d960992049ba # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@db1c7b0288facbdf5afe34db9135d960992049ba # master
    with:
      scandir: scripts
      severity: warning
