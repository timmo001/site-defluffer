---
name: Lint

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@6391eb6416fc711a5d6c1c96b6b4a4b8c16af5af # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@6391eb6416fc711a5d6c1c96b6b4a4b8c16af5af # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@6391eb6416fc711a5d6c1c96b6b4a4b8c16af5af # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@6391eb6416fc711a5d6c1c96b6b4a4b8c16af5af # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@6391eb6416fc711a5d6c1c96b6b4a4b8c16af5af # master
    with:
      scandir: scripts
      severity: warning
